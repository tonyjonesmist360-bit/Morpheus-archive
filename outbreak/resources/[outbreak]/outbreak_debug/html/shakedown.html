<!DOCTYPE html>
<html><head><meta charset="utf-8">
<style>
  :root { --bone:#d8d2c0; --olive:#3c4230; --rust:#b4552d; --smoke:rgba(24,26,19,.94); --ok:#5e8a4c; --bad:#8e2f2f; --line:rgba(216,210,192,.22); }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { overflow:hidden; font-family:'Trebuchet MS','Segoe UI',sans-serif; color:var(--bone); }
  #panel { position:fixed; right:16px; top:60px; width:470px; max-height:84vh; background:var(--smoke); border:1px solid rgba(216,210,192,.3); display:none; flex-direction:column; }
  #panel.on { display:flex; }
  #panel.mouse { border-color:var(--rust); }
  #head { padding:8px 12px; border-bottom:1px solid var(--line); display:flex; justify-content:space-between; align-items:center; font-size:11px; letter-spacing:2.5px; text-transform:uppercase; }
  #head .prog { opacity:.7; letter-spacing:1px; }
  #list { overflow-y:auto; flex:1; }
  .sec { padding:7px 12px 3px; font-size:10px; letter-spacing:2px; text-transform:uppercase; opacity:.6; border-top:1px solid rgba(216,210,192,.1); }
  .step { display:grid; grid-template-columns:1fr auto; gap:6px; padding:5px 12px; font-size:12px; align-items:center; cursor:default; }
  .step.sel { background:rgba(216,210,192,.08); border-left:3px solid var(--rust); }
  .step .st { font-size:9px; letter-spacing:1.5px; text-transform:uppercase; padding:2px 6px; border:1px solid rgba(216,210,192,.3); min-width:52px; text-align:center; }
  .step.pass .st { background:var(--ok); border-color:var(--ok); } .step.fail .st { background:var(--bad); border-color:var(--bad); }
  .step .detail { grid-column:1 / -1; font-size:11px; opacity:.85; line-height:1.45; padding:2px 0 4px; display:none; }
  .step.sel .detail { display:block; }
  .step .detail b { font-weight:normal; letter-spacing:1.4px; text-transform:uppercase; font-size:9px; opacity:.6; margin-right:6px; }
  .step .note { grid-column:1 / -1; font-size:11px; opacity:.75; font-style:italic; }
  .btns { grid-column:1 / -1; display:none; gap:6px; padding:2px 0 4px; }
  .mouse .step.sel .btns { display:flex; }
  .btns button { font:inherit; font-size:10px; letter-spacing:1.5px; text-transform:uppercase; padding:4px 10px; background:transparent; color:var(--bone); border:1px solid var(--line); cursor:pointer; }
  .btns button.p { border-color:var(--ok); } .btns button.f { border-color:var(--bad); }
  .btns button:hover { background:rgba(216,210,192,.1); }
  #foot { padding:8px 12px; border-top:1px solid var(--line); font-size:10px; letter-spacing:1.5px; text-transform:uppercase; opacity:.75; line-height:1.6; }
</style></head>
<body>
<div id="panel">
  <div id="head"><span>TEST MENU</span><span class="prog" id="prog"></span></div>
  <div id="list"></div>
  <div id="foot"><span id="mode"></span></div>
</div>
<script>
let S = { steps:[], sel:0, mouse:false };
const post = (n, b) => fetch(`https://${GetParentResourceName()}/${n}`, { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(b || {}) });
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function render(){
  const l = document.getElementById('list'); let html = '', lastSec = null;
  S.steps.forEach((s, i) => {
    if (s.sec !== lastSec) { html += `<div class="sec">${esc(s.sec)}</div>`; lastSec = s.sec; }
    html += `<div class="step ${i === S.sel ? 'sel' : ''} ${s.status || ''}" id="s${i}" data-i="${i}"><span>${esc(s.id)} ${esc(s.label)}</span><span class="st">${s.status || '—'}</span>
      <div class="detail"><div><b>Do</b>${esc(s.cmd || '')}</div><div><b>Expect</b>${esc(s.expect || '')}</div></div>
      ${s.note ? `<div class="note">${esc(s.note)}</div>` : ''}
      <div class="btns"><button class="p" data-a="pass" data-i="${i}">Pass</button><button class="f" data-a="fail" data-i="${i}">Fail</button><button data-a="note" data-i="${i}">Note</button></div></div>`;
  });
  l.innerHTML = html;
  const done = S.steps.filter(s => s.status).length, fails = S.steps.filter(s => s.status === 'fail').length;
  document.getElementById('prog').textContent = `${done}/${S.steps.length} · ${fails} fail`;
  document.getElementById('mode').innerHTML = S.mouse
    ? 'MOUSE MODE · click a row · Pass / Fail / Note buttons · <u>Esc</u> or <u>M</u> back to the game'
    : '▲▼ step · P pass · F fail · N note · L export · <u>M</u> mouse mode · F9 close';
  document.getElementById('panel').className = 'on' + (S.mouse ? ' mouse' : '');
  const el = document.getElementById('s' + S.sel); if (el) el.scrollIntoView({ block: 'nearest' });
}
document.getElementById('list').addEventListener('click', e => {
  if (!S.mouse) return;
  const b = e.target.closest('button');
  if (b) { const i = +b.dataset.i; if (b.dataset.a === 'note') post('note', { index: i }); else post('mark', { index: i, status: b.dataset.a }); return; }
  const row = e.target.closest('.step'); if (row) post('select', { index: +row.dataset.i });
});
document.addEventListener('keydown', e => { if (S.mouse && (e.key === 'Escape' || e.key === 'm' || e.key === 'M')) post('unfocus'); });
window.addEventListener('message', ({ data }) => {
  if (data.action === 'open') { S.steps = data.steps; S.sel = data.sel || 0; S.mouse = !!data.mouse; render(); }
  else if (data.action === 'close') { document.getElementById('panel').className = ''; }
  else if (data.action === 'update') { S.steps = data.steps; S.sel = data.sel || 0; S.mouse = !!data.mouse; render(); }
});
</script>
</body></html>
