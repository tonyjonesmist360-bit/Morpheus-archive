<!DOCTYPE html>
<html>
<head><meta charset="utf-8">
<style>
  :root { --bone: #d8d2c0; --blood: #8e2f2f; --smoke: rgba(24,26,19,.78); }
  body { margin: 0; overflow: hidden; font-family: 'Trebuchet MS', sans-serif; }
  #veil { position: fixed; inset: 0; display: none; pointer-events: none; }
  #veil.on { display: block; }
  #veil.unconscious { background: radial-gradient(ellipse at center, transparent 20%, rgba(0,0,0,.92) 75%); }
  #veil.incapacitated { background: radial-gradient(ellipse at center, transparent 35%, rgba(60,8,8,.85) 80%); animation: pulse 2.4s infinite; }
  #veil.critical { background: radial-gradient(ellipse at center, rgba(0,0,0,.6) 10%, #000 70%); animation: pulse 4s infinite; }
  #card.critical { border-left-color: #555; }
  @keyframes pulse { 50% { opacity: .75; } }
  #card {
    position: fixed; left: 50%; bottom: 9%; transform: translateX(-50%);
    background: var(--smoke); border: 1px solid rgba(216,210,192,.3);
    border-left: 4px solid var(--bone); color: var(--bone);
    padding: 10px 22px; display: none; text-align: center; letter-spacing: .5px;
  }
  #card.on { display: block; }
  #card.incapacitated { border-left-color: var(--blood); }
  #state { font-size: 15px; font-weight: bold; }
  #hint { font-size: 11.5px; opacity: .8; margin-top: 3px; }
  #timer { font-size: 12px; margin-top: 4px; font-variant-numeric: tabular-nums; }
  #epitaph { position: fixed; inset: 0; background: #000; display: none; place-items: center; text-align: center; color: var(--bone); }
  #epitaph.on { display: grid; }
  #epitaph .line { font-size: 34px; letter-spacing: 6px; animation: fadein 3s ease; }
  #epitaph .sub { font-size: 14px; opacity: .7; margin-top: 12px; letter-spacing: 2px; animation: fadein 5s ease; }
  @keyframes fadein { from { opacity: 0; } }
</style></head>
<body>
  <div id="veil"></div>
  <div id="epitaph"><div class="line">THIS IS HOW YOU DIED.</div><div class="sub" id="epdays"></div></div>
  <div id="card">
    <div id="state"></div>
    <div id="hint"></div>
    <div id="timer"></div>
  </div>
<script>
  let tick = null, remain = 0;
  const veil = document.getElementById('veil'), card = document.getElementById('card');
  const fmt = s => `${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`;
  window.addEventListener('message', ({ data }) => {
    if (data.action === 'epitaph') {
      document.getElementById('epdays').textContent = `SURVIVED ${data.days} DAY${data.days === 1 ? '' : 'S'}`;
      document.getElementById('epitaph').className = 'on';
      setTimeout(() => { document.getElementById('epitaph').className = ''; }, 9000);
      return;
    }
    if (data.action !== 'down') return;
    clearInterval(tick);
    if (!data.state) { veil.className = ''; card.className = ''; return; }
    veil.className = 'on ' + data.state;
    card.className = 'on ' + data.state;
    document.getElementById('state').textContent =
      data.state === 'unconscious' ? 'UNCONSCIOUS' : (data.state === 'critical' ? 'CRITICAL' : 'INCAPACITATED');
    document.getElementById('hint').textContent =
      data.state === 'unconscious'
        ? 'You will come to... eventually. A friend can shake you awake.'
        : (data.state === 'critical' ? 'Unresponsive. Someone must carry you to a medical station.' : 'You are bleeding out. Press E to self-splint, or wait for help.');
    remain = data.seconds;
    const t = document.getElementById('timer');
    t.textContent = fmt(remain);
    tick = setInterval(() => { remain = Math.max(0, remain - 1); t.textContent = fmt(remain); }, 1000);
  });
</script>
</body>
</html>
