<!doctype html>
<meta charset="utf-8">
<title>Outbreak — Status</title>
<style>
  /* Field-gear, same identity as outbreak_hud: stencilled bone-on-olive, worn and quiet.
     Palette and type are lifted from outbreak_hud/html/index.html deliberately - one screen,
     one product. If that file's palette changes, change this one with it. */
  :root{
    --bone:#d8d2c0; --olive:#3c4230; --rust:#b4552d; --blood:#8e2f2f;
    --smoke:rgba(24,26,19,.72); --panel:#1a1d16; --deep:#12140f;
    --line:rgba(216,210,192,.22); --dim:rgba(216,210,192,.55); --faint:rgba(216,210,192,.32);
    --ok:#7d8a5c; --water:#5f8fa3; --food:#c98f3d;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font:13px/1.45 'Trebuchet MS','Segoe UI',sans-serif; color:var(--bone);
    background:transparent; display:none; overflow:hidden; -webkit-font-smoothing:antialiased;
  }
  body.on{display:block}
  #veil{position:fixed;inset:0;background:rgba(12,13,10,.80);
        display:flex;align-items:center;justify-content:center;padding:24px}
  #panel{width:min(1080px,96vw);max-height:92vh;display:flex;flex-direction:column;
         background:var(--deep);border:1px solid var(--line);
         box-shadow:0 24px 80px rgba(0,0,0,.75);animation:rise .13s ease-out}
  @keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

  header{display:flex;align-items:baseline;gap:14px;padding:15px 20px;
         border-bottom:1px solid var(--line);background:var(--smoke)}
  h1{font-size:18px;font-weight:bold;letter-spacing:1.2px;text-transform:uppercase}
  h1 em{font-style:normal;color:var(--faint);font-weight:normal;letter-spacing:.5px}
  .former{color:var(--dim);font-size:12.5px}
  .chips{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap}
  .chip{font-size:10px;letter-spacing:1.2px;text-transform:uppercase;font-weight:bold;
        padding:3px 9px;border:1px solid var(--line);color:var(--dim);
        background:var(--smoke);white-space:nowrap}
  .chip.bad{color:var(--rust);border-color:rgba(180,85,45,.55)}
  .chip.crit{color:var(--bone);background:var(--blood);border-color:var(--blood)}
  .chip.warn{color:var(--food);border-color:rgba(201,143,61,.5)}

  .grid{display:grid;grid-template-columns:1.15fr 1fr 1fr .95fr;gap:1px;
        background:var(--line);flex:1;min-height:0}
  section{background:var(--panel);padding:15px 17px;overflow:auto;min-height:0}
  h2{font-size:10px;letter-spacing:1.6px;text-transform:uppercase;color:var(--faint);
     margin-bottom:12px;font-weight:bold}

  /* Bars echo the HUD's vitals strip: stencil tag, thin track, no rounding. */
  .bar{margin-bottom:11px}
  .bar .t{display:flex;justify-content:space-between;font-size:10px;margin-bottom:4px;
          letter-spacing:1.2px;text-transform:uppercase;font-weight:bold}
  .bar .t b{color:var(--dim)}
  .bar .t span{font-variant-numeric:tabular-nums;color:var(--bone)}
  .track{height:7px;background:var(--smoke);border:1px solid var(--line)}
  .fill{height:100%;transition:width .3s}
  /* Same treatment as the HUD: stripes carry "low" without relying on hue. */
  .fill.low{animation:throb 1.2s infinite;
    background-image:repeating-linear-gradient(45deg,
      rgba(0,0,0,.32) 0 3px, transparent 3px 6px)}
  @keyframes throb{50%{opacity:.45}}

  .rows{display:flex;flex-direction:column;gap:7px}
  .row{display:flex;justify-content:space-between;gap:10px;font-size:12.5px}
  .row b{font-weight:normal;color:var(--dim);text-transform:capitalize}
  .row span{font-variant-numeric:tabular-nums}
  .group{margin-bottom:13px}
  .group>.gh{display:flex;justify-content:space-between;font-size:10px;letter-spacing:1.4px;
             text-transform:uppercase;color:var(--faint);font-weight:bold;
             margin-bottom:5px;border-bottom:1px solid var(--line);padding-bottom:3px}
  .group>.gh span{color:var(--dim)}
  .none{color:var(--faint);font-size:12px;font-style:italic}

  .sk{display:flex;align-items:center;gap:9px;margin-bottom:9px}
  .sk b{font-weight:normal;color:var(--dim);text-transform:uppercase;width:86px;
        font-size:10px;letter-spacing:1.1px}
  .pips{display:flex;gap:3px}
  .pip{width:11px;height:11px;border:1px solid var(--line);background:var(--smoke)}
  .pip.on{background:var(--bone);border-color:var(--bone)}
  .sk em{font-style:normal;color:var(--faint);font-size:11.5px;margin-left:auto;
         font-variant-numeric:tabular-nums}

  .wounds{margin-top:14px}
  .wd{display:flex;justify-content:space-between;font-size:12.5px;padding:4px 0;
      border-bottom:1px solid var(--line)}
  .wd b{font-weight:normal;color:var(--rust);text-transform:capitalize}
  .wd span{color:var(--dim);text-transform:capitalize}

  footer{padding:9px 20px;border-top:1px solid var(--line);display:flex;gap:16px;
         font-size:11px;color:var(--faint);background:var(--smoke)}
  kbd{border:1px solid var(--line);padding:1px 6px;color:var(--dim);
      font-family:inherit;font-size:10px;letter-spacing:1px;font-weight:bold}
  @media(max-width:900px){.grid{grid-template-columns:1fr 1fr}}
</style>

<div id="veil"><div id="panel">
  <header>
    <h1 id="who">—</h1><span class="former" id="former"></span>
    <div class="chips" id="chips"></div>
  </header>
  <div class="grid">
    <section><h2>Condition</h2><div id="cond"></div><div class="wounds" id="wounds"></div></section>
    <section><h2>Carrying</h2><div id="carry"></div></section>
    <section><h2>Skills</h2><div id="skills"></div></section>
    <section><h2>World</h2><div class="rows" id="world"></div></section>
  </div>
  <footer><span><kbd>F1</kbd> or <kbd>Esc</kbd> close</span><span id="hint"></span></footer>
</div></div>

<script>
const $ = id => document.getElementById(id);
const esc = s => String(s==null?'':s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
// Green above 60, amber to 30, red below. Same thresholds everywhere so the
// colour means one thing across the whole panel.
// Bar colours match outbreak_hud exactly - FOOD amber, H2O blue, REST olive, VIT bone -
// so a bar means the same thing whether you glance at the HUD or open this.
const TONE = { vit:'var(--bone)', food:'var(--food)', h2o:'var(--water)', rest:'var(--ok)' };
function bar(tag,v,key){
  v = Math.max(0,Math.min(100, v||0));
  const low = v < 25 ? ' low' : '';
  const col = v < 25 ? 'var(--rust)' : (TONE[key]||'var(--bone)');
  return `<div class="bar"><div class="t"><b>${esc(tag)}</b><span>${v}</span></div>
    <div class="track"><div class="fill${low}" style="width:${v}%;background:${col}"></div></div></div>`;
}

function render(d){
  const id=d.identity||{}, c=d.condition||{}, w=d.world||{};
  $('who').innerHTML = id.callsign ? esc(id.callsign) : '<em>unnamed survivor</em>';
  $('former').textContent = id.former ? '· ' + id.former : '';

  const chips=[];
  if(c.down) chips.push(['crit', c.down]);
  if(c.infected) chips.push(['bad','infected']);
  if(c.bleeding) chips.push(['bad','bleeding']);
  if((c.wounds||[]).length) chips.push(['warn',c.wounds.length+' wound'+(c.wounds.length>1?'s':'')]);
  if(w.blackout) chips.push(['warn','blackout']);
  if(!chips.length) chips.push(['','steady']);
  $('chips').innerHTML = chips.map(([k,t])=>`<span class="chip ${k}">${esc(t)}</span>`).join('');

  $('cond').innerHTML = (typeof c.health==='number' ? bar('Vit',c.health,'vit') : '')
    + bar('Food',c.hunger,'food') + bar('H2O',c.thirst,'h2o') + bar('Rest',c.fatigue,'rest');

  $('wounds').innerHTML = (c.wounds||[]).length
    ? '<h2>Wounds</h2>' + c.wounds.map(x=>`<div class="wd"><b>${esc(x.part)}</b><span>${esc(x.kind)}</span></div>`).join('')
    : '<div class="none">No open wounds.</div>';

  const order=['food','water','meds','tools'];
  $('carry').innerHTML = order.map(g=>{
    const grp=(d.carrying||{})[g]||{items:[],total:0};
    const rows = grp.items.length
      ? grp.items.map(i=>`<div class="row"><b>${esc(i.name)}</b><span>${i.n}</span></div>`).join('')
      : '<div class="none">none</div>';
    return `<div class="group"><div class="gh">${g}<span>${grp.total}</span></div>
            <div class="rows">${rows}</div></div>`;
  }).join('');

  $('skills').innerHTML = (d.skills||[]).map(s=>{
    const lv=Math.max(0,Math.min(10,s.level||0));
    const pips=Array.from({length:10},(_,i)=>`<span class="pip${i<lv?' on':''}"></span>`).join('');
    return `<div class="sk"><b>${esc(s.name)}</b><span class="pips">${pips}</span><em>${lv}</em></div>`;
  }).join('') || '<div class="none">No skills yet.</div>';

  const hh = w.hour==null ? '—' : String(w.hour).padStart(2,'0')+':00';
  const rows=[['Time',hh],['Weather',w.weather||'—'],
              ['Blackout', w.blackout?'yes':'no'],
              ['Noise',(w.noise==null?'—':w.noise)],
              ['Nearby dead',(w.zombies==null?'—':w.zombies)],
              ['Radio',w.channel?('ch '+w.channel):'off'],
              ['Faction',w.job&&w.job!=='unemployed'?w.job:'—'],
              ['Area', w.zone ? String(w.zone).replace(/_/g,' ') : 'open country']];
  $('world').innerHTML = rows.map(([k,v])=>{
    const hot = (k==='Area' && w.heavy) || (k==='Blackout' && w.blackout);
    return `<div class="row"><b>${esc(k)}</b><span${hot?' style="color:var(--rust)"':''}>${esc(v)}</span></div>`;
  }).join('');

  $('hint').textContent = c.infected ? 'Antibiotics buy time. They do not cure it.'
    : c.bleeding ? 'Bleeding. Bandage before you move.'
    : (c.hunger<30||c.thirst<30) ? 'Running low. Eat or drink soon.' : '';
}

window.addEventListener('message', e=>{
  const m=e.data||{};
  if(m.action==='open'){ render(m.data||{}); document.body.classList.add('on'); }
  else if(m.action==='close'){ document.body.classList.remove('on'); }
});
const shut=()=>fetch(`https://${GetParentResourceName()}/close`,{method:'POST',body:'{}'});
document.addEventListener('keydown', e=>{ if(e.key==='Escape'||e.key==='Backspace') shut(); });
$('veil').addEventListener('mousedown', e=>{ if(e.target.id==='veil') shut(); });
</script>
