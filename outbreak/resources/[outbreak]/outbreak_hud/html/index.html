<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  /* Field-gear HUD: stenciled bone-on-olive, worn and quiet.
     One bold element: the moodle column. Everything else stays thin. */
  :root {
    --bone:   #d8d2c0;
    --olive:  #3c4230;
    --rust:   #b4552d;
    --blood:  #8e2f2f;
    --smoke:  rgba(24, 26, 19, 0.72);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { overflow: hidden; font-family: 'Trebuchet MS', 'Segoe UI', sans-serif; }

  /* Vitals strip — bottom left, four thin stacked bars with stencil tags */
  #vitals {
    position: fixed; left: 18px; bottom: 18px; width: 210px;
    display: flex; flex-direction: column; gap: 5px;
  }
  .bar { display: flex; align-items: center; gap: 7px; }
  .tag {
    width: 26px; font-size: 10px; letter-spacing: 1px; color: var(--bone);
    text-shadow: 0 1px 2px rgba(0,0,0,.8); font-weight: bold;
  }
  .track {
    flex: 1; height: 7px; background: var(--smoke);
    border: 1px solid rgba(216, 210, 192, .25);
  }
  .fill { height: 100%; transition: width .6s ease, background .6s; }
  #f-health .fill { background: var(--bone); }
  #f-hunger .fill { background: #c98f3d; }
  #f-thirst .fill { background: #5f8fa3; }
  #f-fatigue .fill { background: #7d8a5c; }
  /* A low bar must not rely on hue alone. Deuteranopia collapses rust and olive toward
     the same yellow-brown, which is exactly the FATIGUE-vs-critical pair. Stripes carry
     the meaning independently of colour; throb carries it independently of both. */
  .fill.low {
    background: var(--rust) !important; animation: throb 1.2s infinite;
    background-image: repeating-linear-gradient(45deg,
      rgba(0,0,0,.32) 0 3px, transparent 3px 6px) !important;
  }
  @keyframes throb { 50% { opacity: .45; } }

  /* World strip — one thin line under the bars. Deliberately the quietest thing on
     screen: time, weather, radio, and whether this place is heavy. Never bold; the
     moodle column stays the only loud element. */
  #strip {
    display: flex; gap: 7px; align-items: center; flex-wrap: wrap;
    font-size: 9.5px; letter-spacing: 1.2px; font-weight: bold;
    color: rgba(216, 210, 192, .45); text-shadow: 0 1px 2px rgba(0,0,0,.8);
    margin-top: 2px; text-transform: uppercase;
  }
  #strip s { text-decoration: none; color: rgba(216, 210, 192, .2); }
  #strip .hot { color: var(--rust); }
  #strip .dark { color: #7f88a8; }

  /* Moodle column — right edge, Zomboid homage */
  #moodles {
    position: fixed; right: 16px; top: 30%;
    display: flex; flex-direction: column; gap: 10px; align-items: flex-end;
  }
  .moodle {
    display: flex; align-items: center; gap: 8px;
    background: var(--smoke); border: 1px solid rgba(216,210,192,.3);
    border-radius: 999px 4px 4px 999px;
    padding: 4px 12px 4px 4px; color: var(--bone); font-size: 12px;
    animation: slidein .35s ease;
  }
  .moodle .dot {
    width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center;
    font-size: 15px; background: var(--olive); border: 1px solid rgba(216,210,192,.35);
  }
  .moodle.danger { border-color: var(--blood); }
  .moodle.danger .dot { background: var(--blood); }
  @keyframes slidein { from { transform: translateX(30px); opacity: 0; } }

  /* Noise ripple — sits above the vitals strip. Quiet = a dot. Loud = spreading rings. */
  #noise {
    position: fixed; left: 18px; bottom: 78px; width: 44px; height: 44px;
    display: grid; place-items: center;
  }
  #ndot {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--bone); grid-area: 1/1;
    transition: background .4s;
  }
  #noise .ring {
    grid-area: 1/1; border-radius: 50%; border: 1.5px solid var(--bone);
    opacity: 0; width: 10px; height: 10px;
  }
  #noise.loud .ring { animation: ripple 1.6s infinite; }
  #noise.loud .r2 { animation-delay: .5s; }
  #noise.loud .r3 { animation-delay: 1s; }
  #noise.danger #ndot { background: var(--rust); }
  #noise.danger .ring { border-color: var(--rust); }
  /* The eye — beside the noise dot. Closed = hidden, opening = noticed, open and rust = seen.
     A one-word tag under it because an icon alone is not a reading. Thin, like the strip. */
  #eye { position: fixed; left: 70px; bottom: 82px; display: flex; flex-direction: column; align-items: center; gap: 3px; }
  #eye svg { width: 28px; height: 16px; overflow: visible; }
  #eye .lid { fill: none; stroke: rgba(216,210,192,.55); stroke-width: 1.6; }
  #eye .pupil { fill: rgba(216,210,192,.55); transform-origin: 14px 8px; transform: scaleY(0); transition: transform .35s; }
  #eye .tag { font-size: 8.5px; letter-spacing: 1.4px; font-weight: bold; color: rgba(216,210,192,.4); text-shadow: 0 1px 2px rgba(0,0,0,.8); }
  #eye.noticed .pupil { transform: scaleY(.6); }
  #eye.noticed .tag { color: #c98f3d; }
  #eye.seen .pupil { transform: scaleY(1); fill: var(--rust); }
  #eye.seen .lid { stroke: var(--rust); }
  #eye.seen .tag { color: var(--rust); animation: throb 1.2s infinite; }
  /* Body scan silhouette. Region fill = state; a cross = broken. Same palette, no new colour:
     bruised is the FOOD amber, bleeding rust, broken blood, treated dim bone. */
  .figure .r { fill: rgba(216,210,192,.06); stroke: rgba(216,210,192,.35); stroke-width: 1.2; transition: fill .4s; }
  .figure .r.bruised  { fill: rgba(201,143,61,.75); }
  .figure .r.bleeding { fill: var(--rust); animation: throb 1.2s infinite; }
  .figure .r.broken   { fill: var(--blood); }
  .figure .r.treated  { fill: rgba(216,210,192,.45); }
  .figure .r.dirty    { stroke: #7d8a5c; stroke-width: 2; }
  .figure .marks path { stroke: var(--bone); stroke-width: 2; fill: none; display: none; }
  .figure .marks path.on { display: block; }
  .figure.infected .r { stroke: #7d8a5c; }
  #body { position: fixed; left: 238px; bottom: 16px; width: 30px; height: 65px; }
  #body .figure { width: 100%; height: 100%; overflow: visible; }
  /* Crew panel — top left, thin. Name, a 60px health line, a one-word state. Only while in a crew. */
  #crew { position: fixed; left: 18px; top: 18px; display: none; flex-direction: column; gap: 4px; min-width: 150px; }
  #crew.on { display: flex; }
  #crew .cn { font-size: 9.5px; letter-spacing: 1.6px; text-transform: uppercase; font-weight: bold; color: rgba(216,210,192,.45); text-shadow: 0 1px 2px rgba(0,0,0,.8); margin-bottom: 2px; }
  #crew .m { display: grid; grid-template-columns: 90px 60px auto; gap: 8px; align-items: center; font-size: 11px; color: var(--bone); text-shadow: 0 1px 2px rgba(0,0,0,.8); }
  #crew .m .nm { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #crew .m .nm.me { color: rgba(216,210,192,.6); }
  #crew .m .tr { height: 5px; background: var(--smoke); border: 1px solid rgba(216,210,192,.25); }
  #crew .m .tr i { display: block; height: 100%; background: var(--bone); }
  #crew .m .tr i.low { background: var(--rust); animation: throb 1.2s infinite; }
  #crew .m .st { font-size: 9px; letter-spacing: 1.2px; text-transform: uppercase; color: rgba(216,210,192,.5); }
  #crew .m .st.bad { color: var(--rust); }
  /* Compass — top centre. Cardinals slide with the camera heading; pins, waypoint and home sit on it. */
  #compass { position: fixed; left: 50%; top: 14px; width: 380px; height: 30px; margin-left: -190px; overflow: hidden;
             -webkit-mask-image: linear-gradient(90deg, transparent, #000 18%, #000 82%, transparent); }
  #compass .track { position: absolute; top: 0; left: 0; height: 100%; }
  #compass .tk { position: absolute; top: 3px; width: 1px; height: 5px; background: rgba(216,210,192,.28); }
  #compass .tk.big { height: 8px; background: rgba(216,210,192,.5); }
  #compass .cd { position: absolute; top: 10px; transform: translateX(-50%); font-size: 10px; letter-spacing: 1px; font-weight: bold; color: rgba(216,210,192,.55); text-shadow: 0 1px 2px rgba(0,0,0,.8); }
  #compass .cd.n { color: var(--rust); }
  #compass .mk { position: absolute; top: 0; transform: translateX(-50%); display: flex; flex-direction: column; align-items: center; }
  #compass .mk i { width: 0; height: 0; border-left: 4px solid transparent; border-right: 4px solid transparent; border-top: 6px solid #c98f3d; }
  #compass .mk b { font-size: 8px; letter-spacing: 1px; text-transform: uppercase; color: rgba(216,210,192,.6); text-shadow: 0 1px 2px rgba(0,0,0,.8); white-space: nowrap; margin-top: 12px; font-weight: bold; }
  #compass .mk.wp i { border-top-color: #5f8fa3; } #compass .mk.home i { border-top-color: var(--bone); }
  #compass .ctr { position: absolute; left: 50%; top: 0; width: 1px; height: 30px; margin-left: -.5px; background: rgba(216,210,192,.35); }
  @keyframes ripple {
    from { width: 10px; height: 10px; opacity: .8; }
    to   { width: 44px; height: 44px; opacity: 0; }
  }
</style>
</head>
<body>
  <div id="vitals">
    <div class="bar" id="f-health"><span class="tag">VIT</span><div class="track"><div class="fill" style="width:100%"></div></div></div>
    <div class="bar" id="f-hunger"><span class="tag">FOOD</span><div class="track"><div class="fill" style="width:100%"></div></div></div>
    <div class="bar" id="f-thirst"><span class="tag">H2O</span><div class="track"><div class="fill" style="width:100%"></div></div></div>
    <div class="bar" id="f-fatigue"><span class="tag">REST</span><div class="track"><div class="fill" style="width:100%"></div></div></div>
    <div id="strip"></div>
  </div>
  <div id="body"><svg viewBox="0 0 60 130" class="figure">
      <circle class="r" data-part="head" cx="30" cy="13" r="10"/>
      <rect class="r" data-part="torso" x="18" y="26" width="24" height="42" rx="4"/>
      <rect class="r" data-part="right_arm" x="5" y="27" width="10" height="40" rx="4"/>
      <rect class="r" data-part="left_arm" x="45" y="27" width="10" height="40" rx="4"/>
      <rect class="r" data-part="right_leg" x="18" y="71" width="11" height="54" rx="4"/>
      <rect class="r" data-part="left_leg" x="31" y="71" width="11" height="54" rx="4"/>
      <g class="marks">
        <path data-part="head" d="M26 9 l8 8 M34 9 l-8 8"/><path data-part="torso" d="M25 42 l10 10 M35 42 l-10 10"/>
        <path data-part="right_arm" d="M7 43 l6 6 M13 43 l-6 6"/><path data-part="left_arm" d="M47 43 l6 6 M53 43 l-6 6"/>
        <path data-part="right_leg" d="M20 94 l7 7 M27 94 l-7 7"/><path data-part="left_leg" d="M33 94 l7 7 M40 94 l-7 7"/>
      </g>
    </svg></div>
  <div id="crew"></div>
  <div id="compass"><div class="track" id="ctrack"></div><div class="ctr"></div></div>
  <div id="moodles"></div>
  <div id="noise"><div class="ring r1"></div><div class="ring r2"></div><div class="ring r3"></div><span id="ndot"></span></div>
  <div id="eye"><svg viewBox="0 0 28 16"><path class="lid" d="M1 8 Q14 -4 27 8 Q14 20 1 8 Z"/><circle class="pupil" cx="14" cy="8" r="3.2"/></svg><span class="tag">HIDDEN</span></div>
<script>
  const set = (id, v) => {
    const el = document.querySelector(id + ' .fill');
    el.style.width = Math.max(0, Math.min(100, v)) + '%';
    el.classList.toggle('low', v < 25);
  };
  // paint the silhouette from a body scan {parts:{part:{state,dirty}}, infected}
  const paintBody = (root, body) => {
    if (!root || !body) return;
    root.classList.toggle('infected', !!body.infected);
    for (const el of root.querySelectorAll('.r')) {
      const p = (body.parts || {})[el.dataset.part] || { state: 'healthy' };
      el.className.baseVal = 'r ' + (p.state || 'healthy') + (p.dirty ? ' dirty' : '');
    }
    for (const m of root.querySelectorAll('.marks path')) {
      const p = (body.parts || {})[m.dataset.part] || {};
      m.classList.toggle('on', p.state === 'broken');
    }
  };
  const moodleDefs = [
    { key: 'hungry',   test: d => d.hunger  < 30, icon: '🥫', text: 'Hungry',   danger: d => d.hunger  <= 5 },
    { key: 'thirsty',  test: d => d.thirst  < 30, icon: '💧', text: 'Thirsty',  danger: d => d.thirst  <= 5 },
    { key: 'tired',    test: d => d.fatigue < 30, icon: '💤', text: 'Exhausted',danger: d => d.fatigue <= 5 },
    { key: 'bleeding', test: d => d.bleeding,     icon: '🩸', text: 'Bleeding', danger: () => true },
    { key: 'wounded',  test: d => Object.values(d.wounds||{}).some(w => !w.treated), icon: '🩹', text: d => { const n = Object.values(d.wounds||{}).filter(w=>!w.treated).length; return n + (n===1?' open wound':' open wounds'); }, danger: d => Object.values(d.wounds||{}).some(w => !w.treated && (w.kind==='gunshot'||w.kind==='fracture')) },
    { key: 'infected', test: d => !!d.infection,  icon: '🦠', text: d => d.infection, danger: d => d.infection === 'Fever' || d.infection === 'Critical' },
  ];
  // ── compass ──
  const PX = 380 / 120;            // pixels per degree: the strip shows 120 degrees
  const CARD = { 0:'N', 45:'NE', 90:'E', 135:'SE', 180:'S', 225:'SW', 270:'W', 315:'NW' };
  const ctrack = document.getElementById('ctrack');
  const wrap = a => ((a % 360) + 360) % 360;
  let marks = [];
  const drawCompass = (h) => {
    const hh = wrap(h); let html = '';
    const rel = a => { let d = wrap(a) - hh; if (d > 180) d -= 360; if (d < -180) d += 360; return d; };
    for (let a = 0; a < 360; a += 5) { const d = rel(a); if (Math.abs(d) <= 62) html += `<span class="tk ${a % 45 === 0 ? 'big' : ''}" style="left:${190 + d * PX}px"></span>`; }
    for (const a in CARD) { const d = rel(+a); if (Math.abs(d) <= 62) html += `<span class="cd ${+a === 0 ? 'n' : ''}" style="left:${190 + d * PX}px">${CARD[a]}</span>`; }
    for (const m of marks) { const d = rel(m.b); if (Math.abs(d) <= 62) html += `<span class="mk ${m.k || ''}" style="left:${190 + d * PX}px"><i></i><b>${m.l || ''}</b></span>`; }
    ctrack.innerHTML = html;
  };
  // ── crew ──
  const drawCrew = (c) => {
    const el = document.getElementById('crew');
    if (!c || !c.members || !c.members.length) { el.className = ''; el.innerHTML = ''; return; }
    el.className = 'on';
    el.innerHTML = `<div class="cn">${c.name}</div>` + c.members.map(m => {
      const st = m.down ? 'DOWN' : m.bleed ? 'BLEEDING' : m.infected ? 'INFECTED' : (m.me ? 'you' : (m.dist != null ? m.dist + ' m' : ''));
      return `<div class="m"><span class="nm ${m.me ? 'me' : ''}">${m.leader ? '★ ' : ''}${m.name}</span><span class="tr"><i class="${m.hp < 25 ? 'low' : ''}" style="width:${Math.max(0, Math.min(100, m.hp || 0))}%"></i></span><span class="st ${(m.down || m.bleed || m.infected) ? 'bad' : ''}">${st}</span></div>`;
    }).join('');
  };
  window.addEventListener('message', ({ data }) => {
    if (data.action === 'compass') { if (data.marks) marks = data.marks; drawCompass(data.heading || 0); return; }
    if (data.action === 'crew') { drawCrew(data.data); return; }
    if (data.action === 'noise') {
      const n = document.getElementById('noise');
      n.classList.toggle('loud', data.value > 25);
      n.classList.toggle('danger', data.value > 60);
      return;
    }
    if (data.action === 'sight') {
      const s = data.data || {}, e = document.getElementById('eye'), sus = s.suspicion || 0;
      e.classList.toggle('seen', sus >= 100);
      e.classList.toggle('noticed', sus > 0 && sus < 100);
      const tag = e.querySelector('.tag');
      tag.textContent = sus >= 100 ? 'SEEN' : sus > 0 ? 'NOTICED' : (s.visibility || 50) <= 20 ? 'HIDDEN' : (s.visibility || 50) >= 80 ? 'EXPOSED' : 'UNSEEN';
      return;
    }
    if (data.action === 'world') {
      const w = data.data || {}, bits = [];
      if (w.hour != null) bits.push(String(w.hour).padStart(2,'0') + ':00');
      if (w.blackout) bits.push('<span class="dark">BLACKOUT</span>');
      if (w.weather) bits.push(w.weather);
      if (w.channel) bits.push('CH ' + w.channel);
      if (w.zone) bits.push(`<span class="${w.heavy ? 'hot' : ''}">${String(w.zone).replace(/_/g,' ')}</span>`);
      if (w.tide) bits.push('<span class="hot">THE TIDE</span>');
      // Home: one token, only when it matters. Critical names the category; low is a single quiet word.
      if (w.home) {
        const h = w.home, crit = (h.critical || []), low = (h.low || []);
        if (h.starving) bits.push('<span class="hot">HOME STARVING</span>');
        else if (crit.length) bits.push(`<span class="hot">HOME ${crit.join(' ')}</span>`);
        else if (low.length) bits.push('HOME LOW');
      }
      document.getElementById('strip').innerHTML = bits.join('<s>/</s>');
      return;
    }
    if (data.action !== 'needs') return;
    const d = data.data;
    set('#f-health',  d.health);
    set('#f-hunger',  d.hunger);
    set('#f-thirst',  d.thirst);
    set('#f-fatigue', d.fatigue);
    paintBody(document.getElementById('body'), d.body);
    const box = document.getElementById('moodles');
    box.innerHTML = '';
    for (const m of moodleDefs) {
      if (!m.test(d)) continue;
      const el = document.createElement('div');
      el.className = 'moodle' + (m.danger(d) ? ' danger' : '');
      const text = typeof m.text === 'function' ? m.text(d) : m.text;
      el.innerHTML = `<span class="dot">${m.icon}</span>${text}`;
      box.appendChild(el);
    }
  });
</script>
</body>
</html>
